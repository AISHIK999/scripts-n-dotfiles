# Required
NAME=myapp
# Optional; defaults: REPO_DIR=$HOME/$NAME, COMPOSE_DIR=$REPO_DIR, STATE_DIR=$HOME/shared/$NAME,
#                     LOG_DIR=$HOME/logs/$NAME-deploy, REMOTE=origin, BRANCH=master
